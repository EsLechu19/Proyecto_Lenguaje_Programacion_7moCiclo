{% extends 'base.html' %}

{% block title %}Formulario Categoría - StockWise{% endblock %}

{% block content %}

<div class="mb-4">
    <h1>Formulario de categoría</h1>
    <p class="text-muted">Registra o actualiza una categoría del inventario.</p>
</div>

<div class="card dashboard-card">
    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary rounded-3">
                Guardar categoría
            </button>

            <a href="{% url 'lista_categorias' %}" class="btn btn-secondary rounded-3">
                Cancelar
            </a>
        </form>

    </div>
</div>

{% endblock %}
